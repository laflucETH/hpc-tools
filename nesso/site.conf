# Where this checkout looks for built Nesso-1 images. Moving the install to another folder means
# moving that folder and changing this one line (or exporting NESSO_HOME, which wins over it).
#
# This is deliberately ONE location for the whole group, not one per user. A pip install of
# Nesso-1 is 41,358 files and 7.1 GB on project storage, which is quota-limited in files rather
# than bytes; an image is one file that everyone reads.
#
# Layout under NESSO_HOME:
#   <release>/nesso.sif          the image
#   <release>/BUILD_INFO.txt     what went into it, with checksums
#   current -> <release>         relative link to the default release
: "${NESSO_HOME:=/cluster/work/beltrao/lucla/hpc-tools/nesso}"
