# Where this checkout looks for built Boltz-2 images. Moving the install to another folder means
# moving that folder and changing this one line (or exporting BOLTZ2_HOME, which wins over it).
#
# Layout under BOLTZ2_HOME:
#   <release>/boltz2.sif         the image
#   <release>/BUILD_INFO.txt     what went into it, with checksums
#   current -> <release>         relative link to the default release
: "${BOLTZ2_HOME:=/cluster/work/beltrao/lucla/hpc-tools/boltz2}"
